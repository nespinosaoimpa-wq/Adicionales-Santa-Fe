    <!-- DOMAIN RESILIENCE & AUTO-FIX v1.0 -->
    <script>
        const PRIMARY_DOMAIN = 'adicionalessantafe.com.ar';
        const FALLBACK_URL = 'https://nespinosaoimpa-wq.github.io/Adicionales-Santa-Fe/';

        // 1. Silent DNS Check: Only if on fallback or if there's an error
        if (window.location.hostname !== PRIMARY_DOMAIN) {
            console.log('🛡️ Utility running on fallback/local. Monitoring primary domain...');
        } else {
            console.log('🛡️ Utility running on primary domain. Performance optimized.');
        }

        // 2. Nuclear Cache Killer & Recovery Logic (Updated)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                let needsHardReset = false;
                for (let reg of registrations) {
                    const url = reg.active?.scriptURL || reg.installing?.scriptURL || reg.waiting?.scriptURL || '';
                    if (url && !url.includes('sw-v534-9_final.js')) {
                        console.warn('☢️ SW Outdated:', url);
                        reg.unregister();
                        needsHardReset = true;
                    }
                }
                if (needsHardReset || !localStorage.getItem('app_v534_9_3_initialized')) {
                    if ('caches' in window) {
                        caches.keys().then(names => Promise.all(names.map(n => caches.delete(n))))
                            .then(() => {
                                localStorage.setItem('app_v534_9_3_initialized', 'true');
                                window.location.reload(true);
                            });
                    }
                }
            });
        }
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Registro estable sin timestamp dinámico para evitar el bucle infinito
                navigator.serviceWorker.register('./sw-v535-3.js?v=535.3.0')







                    .then(registration => {


                        console.log('ServiceWorker v534.9.1 registrado con éxito: ', registration.scope);

                        // Detectar si hay un nuevo worker instalándose
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('Nueva actualización de SW disponible.');
                                    // En lugar de recargar forzosamente y crear un bucle, esperamos a la próxima visita
                                    // o dejamos que el banner de actualización avise al usuario.
                                }
                            });
                        });
                    }, err => {
                        console.log('Fallo el registro del ServiceWorker: ', err);
                    });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    // Solo recargar una única vez si cambian los assets troncales, 
                    // pero al haber fijado la URL del SW ya no entrará en bucle.
                    console.log('SW Controller change detectado.');
                }
            });
        }
    </script>

    <!-- DOMAIN RESILIENCE & AUTO-FIX v1.0 -->
    <script>
        const PRIMARY_DOMAIN = 'adicionalessantafe.com.ar';
        const FALLBACK_URL = 'https://nespinosaoimpa-wq.github.io/Adicionales-Santa-Fe/';

        if (window.location.hostname !== PRIMARY_DOMAIN) {
            console.log('🛡️ Utility running on fallback/local. Monitoring primary domain...');
        } else {
            console.log('🛡️ Utility running on primary domain. Performance optimized.');
        }

        // Force-purge old service workers
        try {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (var i = 0; i < registrations.length; i++) {
                        var reg = registrations[i];
                        var sUrl = (reg && reg.active && reg.active.scriptURL) ? reg.active.scriptURL : '';
                        if (sUrl.includes('sw-v535-6-0') || sUrl.includes('sw-v535-6-1') || sUrl.includes('sw-v535-7-0')) {
                            console.log('Unregistering v6 worker:', sUrl);
                            reg.unregister().catch(function(){});
                            if ('caches' in window) {
                                caches.keys().then(function(keys) {
                                    keys.forEach(function(k) { caches.delete(k); });
                                }).catch(function(){});
                            }
                        }
                    }
                }).catch(function(){});
            }
        } catch(e) {}

        // Dynamic PWA Cache Buster & Auto-Updater
        const CURRENT_VERSION = 'v535.9.5';
        try {
            fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
                .then(res => res.json())
                .then(data => {
                    const reloadKey = 'reloaded_v_' + (data ? data.version : '');
                    if (data && data.version && data.version !== CURRENT_VERSION && !sessionStorage.getItem(reloadKey)) {
                        sessionStorage.setItem(reloadKey, 'true');
                        console.warn('⚠️ Nueva versión detectada:', data.version, '. Limpiando caché y actualizando...');
                        if ('serviceWorker' in navigator) {
                            navigator.serviceWorker.getRegistrations().then(registrations => {
                                for (let reg of registrations) {
                                    reg.unregister().catch(function(){});
                                }
                                if ('caches' in window) {
                                    caches.keys().then(names => Promise.all(names.map(n => caches.delete(n))))
                                        .then(() => { window.location.reload(true); })
                                        .catch(() => { window.location.reload(true); });
                                } else {
                                    window.location.reload(true);
                                }
                            }).catch(() => { window.location.reload(true); });
                        } else {
                            window.location.reload(true);
                        }
                    }
                })
                .catch(err => console.log('Bypass de verificación rápida (offline o local):', err));
        } catch(e) {}
    </script>

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {

                    .then(registration => {
                        console.log('ServiceWorker v535.9.5 registrado con éxito: ', registration.scope);
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('Nueva actualización de SW disponible.');
                                }
                            });
                        });
                    }, err => {
                        console.log('Fallo el registro del ServiceWorker: ', err);
                    });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    console.log('SW Controller change detectado.');
                }
            });
        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pwaBanner = document.getElementById('pwa-cookie-banner');
            const pwaAcceptBtn = document.getElementById('pwa-accept-cookies');
            
            if (!localStorage.getItem('cookie_consent_accepted')) {
                setTimeout(() => {
                    pwaBanner.classList.remove('hidden');
                    setTimeout(() => pwaBanner.classList.remove('translate-y-full'), 50);
                }, 1500);
            }

            pwaAcceptBtn.addEventListener('click', () => {
                localStorage.setItem('cookie_consent_accepted', 'true');
                pwaBanner.classList.add('translate-y-full');
                setTimeout(() => pwaBanner.classList.add('hidden'), 500);

name: Deploy PWA to GitHub Pages & Production Domain

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Build dual-path distribution directory
        run: |
          mkdir -p build/app
          # 1. Copiar landing page, paginas de contenido (guias), politicas, terminos, about, robots, sitemap y ads.txt a la raiz
          cp *.html build/
          cp *.txt build/
          cp *.xml build/
          cp *.pdf build/ 2>/dev/null || true
          cp *.js build/ 2>/dev/null || true
          cp *.png build/ 2>/dev/null || true
          if [ -d "assets" ]; then cp -r assets build/; fi
          # 2. Copiar la PWA web application a /app
          cp -r app/* build/app/
          # 3. Replicar paginas legales y ads.txt dentro de /app para evitar cualquier 404
          cp privacy.html terms.html about.html ads.txt robots.txt build/app/
          # 4. Asignar el dominio personalizado de produccion
          echo "adicionalessantafe.com.ar" > build/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          cname: adicionalessantafe.com.ar
          force_orphan: true
